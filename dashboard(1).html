<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dashboard avis – VAECO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#0d1240;--muted:#5b6079;--line:#e2e6f0;--blue:#0b6cf7;--hd:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1020;--card:#171b33;--ink:#eef0fb;--muted:#a1a7c4;--line:#272c4a;--hd:#10142b}}
:root[data-theme="dark"]{--bg:#0d1020;--card:#171b33;--ink:#eef0fb;--muted:#a1a7c4;--line:#272c4a;--hd:#10142b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,"Segoe UI",system-ui,Arial,sans-serif}
header{background:var(--hd);padding:16px 5vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px}
button{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:700 14px inherit;cursor:pointer}
input{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
main{max-width:1000px;margin:24px auto;padding:0 16px}
#login{max-width:360px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;text-align:center}
#login input{width:100%;margin:14px 0}
#err{color:#d92d20;font-size:14px;min-height:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.stat b{display:block;font-size:32px}.stat span{color:var(--muted);font-size:14px}
.card h2{margin:0 0 12px;font-size:17px}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar .lab{width:110px;flex:none}.bar .tr{flex:1;background:var(--line);border-radius:6px;height:14px}
.bar .fi{background:var(--blue);height:100%;border-radius:6px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div id="login">
  <h1 style="margin:0 0 4px;font-size:22px">Dashboard VAECO</h1>
  <div style="color:var(--muted)">Entrez votre mot de passe</div>
  <input id="key" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <div id="err"></div>
  <button id="go">Se connecter</button>
</div>
<div id="app" hidden>
  <header><h1>Dashboard avis · VAECO</h1><button id="refresh">Actualiser</button></header>
  <main>
    <div class="stats">
      <div class="card stat"><b id="s1">0</b><span>Arrivées sur la page</span></div>
      <div class="card stat"><b id="s2">0</b><span>Réactions (emoji)</span></div>
      <div class="card stat"><b id="s3">0</b><span>Clics vers Google</span></div>
    </div>
    <div class="card" style="margin-bottom:16px"><h2>Répartition des émojis</h2><div id="bars"></div></div>
    <div class="card"><h2>Derniers évènements</h2><div class="wrap"><table><thead><tr><th>Date</th><th>Évènement</th><th>Emoji</th><th>Ville</th><th>Pays</th><th>IP</th></tr></thead><tbody id="rows"></tbody></table></div></div>
  </main>
</div>
<script>
var URL_SCRIPT="https://script.google.com/macros/s/AKfycbw7Hejh2xHERglo923uf56jdEV0nBwAE2yTpwF4upTcxWXK_k5lhX-eRfJhVnFaOzHc/exec";
var $=function(i){return document.getElementById(i)};
function load(key){
  $("err").textContent="";
  return fetch(URL_SCRIPT+"?key="+encodeURIComponent(key)).then(function(r){return r.json()}).then(function(d){
    if(d.error){$("err").textContent="Mot de passe incorrect.";return false}
    render(d.rows||[]);$("login").hidden=true;$("app").hidden=false;
    try{sessionStorage.setItem("k",key)}catch(e){}return true;
  }).catch(function(){$("err").textContent="Connexion impossible (URL du script ?)."});
}
function render(r){
  var a=0,e=0,g=0,c={};
  r.forEach(function(x){if(x.evt==="arrivée")a++;else if(x.evt==="emoji"){e++;c[x.emoji]=(c[x.emoji]||0)+1}else if(x.evt==="clic Google")g++});
  $("s1").textContent=a;$("s2").textContent=e;$("s3").textContent=g;
  var bars=$("bars");bars.textContent="";
  var keys=Object.keys(c).sort(function(p,q){return c[q]-c[p]});
  if(!keys.length)bars.textContent="Pas encore de données.";
  keys.forEach(function(k){
    var d=document.createElement("div");d.className="bar";
    var l=document.createElement("span");l.className="lab";l.textContent=k;
    var t=document.createElement("div");t.className="tr";var f=document.createElement("div");f.className="fi";f.style.width=(c[k]/e*100)+"%";t.appendChild(f);
    var n=document.createElement("span");n.textContent=c[k];
    d.append(l,t,n);bars.appendChild(d);
  });
  var tb=$("rows");tb.textContent="";
  r.slice(0,200).forEach(function(x){
    var tr=document.createElement("tr");
    [new Date(x.date).toLocaleString("fr-FR"),x.evt,x.emoji,x.ville,x.pays,x.ip].forEach(function(v){var td=document.createElement("td");td.textContent=v||"";tr.appendChild(td)});
    tb.appendChild(tr);
  });
}
$("go").addEventListener("click",function(){load($("key").value)});
$("key").addEventListener("keydown",function(e){if(e.key==="Enter")load($("key").value)});
$("refresh").addEventListener("click",function(){var k="";try{k=sessionStorage.getItem("k")||""}catch(e){}load(k)});
try{var k=sessionStorage.getItem("k");if(k)load(k)}catch(e){}
</script>
</body>
</html>
